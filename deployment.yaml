apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app
  namespace: trisha-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-app
  template:
    metadata:
      labels:
        app: devops-app
    spec:
      containers:
      - name: devops-app
        image: trisham135/devops-app:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: devops-app-service
  namespace: trisha-ns
spec:
  selector:
    app: devops-app
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer